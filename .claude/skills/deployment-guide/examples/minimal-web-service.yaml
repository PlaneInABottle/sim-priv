# Minimal Render Web Service Blueprint

Simple web service with PostgreSQL database for basic applications.

```yaml
# render.yaml
services:
  - type: web
    name: web-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString

databases:
  - name: app-db
    plan: basic-256mb
    postgresMajorVersion: '16'
```

## What This Creates

- **Web Service**: Basic plan (512 MB RAM, 0.5 CPU)
- **Database**: Basic 256MB plan
- **Environment Variables**: DATABASE_URL automatically configured
- **Health Check**: Expects /health endpoint

## Requirements

- Dockerfile named `Dockerfile` in repository root
- Application exposes health check endpoint at /health
- Compatible with PostgreSQL database

## Scaling

Upgrade service plan for more resources:
- `standard`: 2 GB RAM, 1 CPU
- `pro`: 4 GB RAM, 2 CPU
